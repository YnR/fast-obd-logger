name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Put the logger page into the app
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FastOBD.apk
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest FastOBD.apk --prerelease --title "Android app (latest)" --notes "Debug build of ${{ github.sha }}. Sideload this APK."
